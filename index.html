<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>Kanti-Trainer Deutsch</title>
<meta name="author" content="Alexander Weng">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: Halingen-Designsystem wie die Leistungs-App – dunkle Kopfzeile mit Logo, Stufe/XP/Serie, darunter Lernpfad-Karten; Übungen in einer Spalte, Leseverstehen zweispaltig */
:root {
  --gray-950: oklch(0.18 0.006 240); --gray-900: oklch(0.24 0.006 240); --gray-700: oklch(0.42 0.006 240);
  --gray-500: oklch(0.58 0.006 240); --gray-300: oklch(0.80 0.005 240); --gray-150: oklch(0.90 0.004 240);
  --gray-100: oklch(0.95 0.003 240); --gray-50: oklch(0.985 0.002 240); --white: oklch(0.99 0.001 240);
  --accent-700: oklch(0.38 0.075 155); --accent-600: oklch(0.45 0.08 155); --accent-100: oklch(0.95 0.02 155);
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Source Sans 3', Helvetica, Arial, sans-serif;
  --font-mono: 'JetBrains Mono', 'SFMono-Regular', Menlo, monospace;
  --text-xs: .75rem; --text-sm: .875rem; --text-base: 1rem; --text-md: 1.125rem; --text-lg: 1.375rem; --text-xl: 1.75rem; --text-2xl: 2.25rem; --text-3xl: 3rem;
  --tw: .12em;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  --r: 8px;
  --bg: var(--white); --surface: var(--white); --subtle: var(--gray-100);
  --text: var(--gray-950); --muted: var(--gray-700); --line: var(--gray-950); --line-soft: var(--gray-300);
  --primary: var(--accent-600); --on-primary: var(--white); --accent-text: var(--accent-700); --accent-bg: var(--accent-100);
  --good: oklch(0.40 0.09 155); --good-bg: oklch(0.94 0.045 155);
  --bad: oklch(0.46 0.13 25); --bad-bg: oklch(0.95 0.035 25);
  --warn: oklch(0.42 0.09 75); --warn-bg: oklch(0.95 0.05 80);
  --gold: oklch(0.72 0.13 80); --gold-ink: oklch(0.30 0.06 75);
  --mark: oklch(0.93 0.12 100); --mark-ink: var(--gray-950);
  --header-bg: var(--gray-950); --header-text: var(--white); --header-muted: var(--gray-300); --header-line: oklch(0.45 0.006 240);
  --bar-track: var(--gray-150); --bar-fill: var(--accent-600); --xp-fill: oklch(0.78 0.12 155);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --bg: var(--gray-950); --surface: var(--gray-900); --subtle: oklch(0.21 0.006 240);
  --text: var(--gray-50); --muted: var(--gray-300); --line: var(--gray-300); --line-soft: var(--gray-700);
  --primary: oklch(0.78 0.12 155); --on-primary: var(--gray-950); --accent-text: oklch(0.84 0.11 155); --accent-bg: oklch(0.27 0.05 155);
  --good: oklch(0.84 0.12 155); --good-bg: oklch(0.27 0.05 155); --bad: oklch(0.82 0.10 25); --bad-bg: oklch(0.28 0.05 25);
  --warn: oklch(0.86 0.10 80); --warn-bg: oklch(0.29 0.05 75); --gold: oklch(0.80 0.13 85); --gold-ink: var(--gray-950);
  --mark: oklch(0.82 0.13 100); --header-bg: oklch(0.13 0.006 240); --bar-track: var(--gray-700); --bar-fill: oklch(0.78 0.12 155);
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: var(--gray-950); --surface: var(--gray-900); --subtle: oklch(0.21 0.006 240);
  --text: var(--gray-50); --muted: var(--gray-300); --line: var(--gray-300); --line-soft: var(--gray-700);
  --primary: oklch(0.78 0.12 155); --on-primary: var(--gray-950); --accent-text: oklch(0.84 0.11 155); --accent-bg: oklch(0.27 0.05 155);
  --good: oklch(0.84 0.12 155); --good-bg: oklch(0.27 0.05 155); --bad: oklch(0.82 0.10 25); --bad-bg: oklch(0.28 0.05 25);
  --warn: oklch(0.86 0.10 80); --warn-bg: oklch(0.29 0.05 75); --gold: oklch(0.80 0.13 85); --gold-ink: var(--gray-950);
  --mark: oklch(0.82 0.13 100); --header-bg: oklch(0.13 0.006 240); --bar-track: var(--gray-700); --bar-fill: oklch(0.78 0.12 155);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: var(--text-md); line-height: 1.45; min-height: 100vh; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--header-bg); }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; }
.mono { font-family: var(--font-mono); }
.b { font-weight: 700; }
.small { font-size: var(--text-sm); color: var(--muted); }
.tag { font-size: var(--text-xs); font-weight: 700; letter-spacing: var(--tw); text-transform: uppercase; color: var(--accent-text); }
.tag.inv { color: var(--header-muted); }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
.wrap { max-width: 760px; margin: 0 auto; padding-block: var(--s5) var(--s7); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap.wide { max-width: 1280px; }

/* Kopf */
.top { background: var(--header-bg); color: var(--header-text); padding-block: var(--s4) var(--s5); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 2px solid var(--line); }
.top > * { max-width: 728px; margin-left: auto; margin-right: auto; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s5); flex-wrap: wrap; }
.logochip { background: #fff; border-radius: var(--r); padding: 6px 10px; display: flex; }
.logochip img { height: 34px; width: auto; display: block; }
@media (max-width: 480px) { .tabs button { font-size: var(--text-sm); } }
.top h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(2.2rem, 7vw, 3.5rem); line-height: 1.05; letter-spacing: -0.01em; }
.lead { color: var(--header-muted); margin-top: var(--s2); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s2); margin-top: var(--s5); }
.stat { border: 2px solid var(--header-line); border-radius: var(--r); padding: var(--s3); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .k { font-size: var(--text-xs); font-weight: 700; letter-spacing: var(--tw); text-transform: uppercase; color: var(--header-muted); }
.stat .v { font-weight: 700; font-size: var(--text-md); line-height: 1.15; overflow-wrap: break-word; hyphens: auto; }
.stat .s { font-size: var(--text-xs); color: var(--header-muted); }
.xpbar { height: 12px; border-radius: 6px; background: var(--header-line); margin-top: var(--s4); overflow: hidden; }
.xpbar > div { height: 100%; background: var(--xp-fill); border-radius: 6px; transition: width .9s cubic-bezier(.3,.8,.3,1); }
.xpbar.light { background: var(--bar-track); margin: var(--s3) 0 var(--s4); }
.xpbar.light > div { background: var(--bar-fill); transition: width .35s ease; }
.tabs { display: flex; gap: var(--s2); margin-top: var(--s5); flex-wrap: wrap; }
.tabs button { flex: 1 1 0; min-width: 0; padding: 0 8px; min-height: 44px; border: 2px solid var(--header-line); background: transparent; color: var(--header-text); border-radius: var(--r); font-weight: 700; cursor: pointer; }
.tabs button[aria-current="page"] { background: var(--header-text); color: var(--header-bg); border-color: var(--header-text); }

/* Lernpfad */
.row { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin: var(--s5) 0 var(--s3); flex-wrap: wrap; }
.row h2, .sumh, .lh { font-family: var(--font-display); font-weight: 600; font-size: var(--text-xl); line-height: 1.15; }
.path { display: flex; flex-direction: column; gap: var(--s3); }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: var(--s4); min-width: 0; }
.st { display: grid; grid-template-columns: 44px 1fr; grid-template-areas: "num body" "act act"; gap: var(--s3); align-items: start; }
.st .num { grid-area: num; width: 44px; height: 44px; border-radius: 50%; background: var(--text); color: var(--bg); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: var(--text-md); }
.st .stbody { grid-area: body; min-width: 0; }
.st > .btn { grid-area: act; width: 100%; }
.st h3, .review h3, .chal h3 { font-family: var(--font-display); font-weight: 600; font-size: var(--text-lg); line-height: 1.2; }
.sub { font-size: var(--text-sm); color: var(--accent-text); margin-top: 2px; font-weight: 600; }
.mast { display: flex; gap: 3px; margin-top: var(--s3); }
.seg { height: 8px; flex: 1; border-radius: 3px; background: var(--bar-track); }
.seg.on { background: var(--bar-fill); }
.starsrow { display: flex; align-items: center; gap: var(--s3); margin-top: var(--s2); flex-wrap: wrap; }
.stars { font-size: var(--text-lg); letter-spacing: 3px; color: var(--gold); line-height: 1; }
.stars .off { color: var(--line-soft); }
.review { display: grid; gap: var(--s3); background: var(--accent-bg); }
.review p { margin-top: var(--s1); color: var(--text); }
.cathead { display: flex; align-items: baseline; gap: var(--s3); margin: var(--s6) 0 var(--s3); flex-wrap: wrap; }
.cathead h2 { font-family: var(--font-display); font-weight: 600; font-size: var(--text-xl); }
@media (min-width: 560px) {
  .st { grid-template-columns: 44px 1fr auto; grid-template-areas: "num body act"; align-items: center; }
  .st > .btn { width: auto; min-width: 120px; }
  .review { grid-template-columns: 1fr auto; align-items: center; }
  .review > .btn { min-width: 170px; }
}

/* Buttons */
.btn { appearance: none; min-height: 52px; padding: 0 var(--s5); border: 2px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--text); font: 700 var(--text-md)/1.1 var(--font-body); cursor: pointer; }
.btn:hover { background: var(--subtle); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn-primary:hover { background: var(--primary); filter: brightness(1.08); }
.btn.sm { min-height: 40px; padding: 0 var(--s3); font-size: var(--text-sm); }
.btn.block { display: block; width: 100%; margin-top: var(--s3); }
.btn:disabled { opacity: .4; cursor: default; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent-text); text-decoration: underline; text-underline-offset: 3px; font-weight: 700; cursor: pointer; font-size: inherit; }

/* Runde */
.rtop { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); flex-wrap: wrap; }
.qcard { padding: var(--s5) var(--s4); }
.tags { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; margin-bottom: var(--s3); }
.badge { font-size: var(--text-xs); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; background: var(--text); color: var(--bg); }
.instr { font-weight: 700; margin-bottom: var(--s2); }
.merk { margin: var(--s2) 0 var(--s4); }
.merk summary { cursor: pointer; color: var(--accent-text); font-weight: 700; font-size: var(--text-sm); list-style: none; display: inline-flex; gap: 8px; align-items: center; }
.merk summary::-webkit-details-marker { display: none; }
.merk summary::before { content: "★"; display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--primary); color: var(--on-primary); font-size: 12px; }
.merk > div { margin-top: var(--s2); border: 2px solid var(--primary); background: var(--accent-bg); border-radius: var(--r); padding: var(--s3); font-size: var(--text-base); }
.q { font-family: var(--font-display); font-weight: 500; font-size: clamp(1.3rem, 3.6vw, 1.6rem); line-height: 1.45; margin: var(--s2) 0 var(--s5); }
.q u { text-decoration: none; background: linear-gradient(transparent 58%, var(--mark) 58%); padding: 0 2px; }
.q .target { display: inline-block; font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 700; letter-spacing: .04em; background: var(--text); color: var(--bg); padding: 3px 8px; border-radius: 4px; vertical-align: middle; margin-left: 8px; }
.opts { display: flex; flex-direction: column; gap: var(--s3); }
.opts.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.opt { appearance: none; display: flex; align-items: flex-start; gap: var(--s3); text-align: left; width: 100%; min-height: 52px; padding: var(--s3) var(--s4); border: 2px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--text); font: 500 var(--text-md)/1.35 var(--font-body); cursor: pointer; }
.opt:hover:not(:disabled) { background: var(--subtle); }
.opt .ltr { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: var(--text-sm); }
.opt:disabled { cursor: default; opacity: .75; }
.opt.sel { background: var(--accent-bg); border-color: var(--primary); }
.opt.good { opacity: 1; background: var(--good-bg); border-color: var(--good); color: var(--good); }
.opt.good .ltr { background: var(--good); color: var(--good-bg); border-color: var(--good); }
.opt.bad { opacity: 1; background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.opt.bad .ltr { background: var(--bad); color: var(--bad-bg); border-color: var(--bad); }
.ansrow { display: flex; gap: var(--s3); flex-wrap: wrap; }
.numin { flex: 1 1 260px; min-width: 0; min-height: 56px; padding: 0 var(--s4); border: 2px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--text); font: 600 var(--text-lg) var(--font-body); }
.numin.ok { border-color: var(--good); background: var(--good-bg); }
.numin.err { border-color: var(--bad); background: var(--bad-bg); }
.fb { margin-top: var(--s4); border: 2px solid; border-radius: var(--r); padding: var(--s4); }
.fb .fbt { font-weight: 700; font-size: var(--text-md); margin-bottom: var(--s1); display: flex; justify-content: space-between; gap: var(--s2); }
.fb .fbb { font-size: var(--text-base); line-height: 1.5; color: var(--text); }
.fb .sol { font-family: var(--font-display); font-size: var(--text-md); color: var(--text); }
.fb .xp { font-size: var(--text-sm); color: var(--muted); margin-top: 4px; }
.fb.good { background: var(--good-bg); border-color: var(--good); color: var(--good); }
.fb.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.fb.warn { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }
.xppop { background: var(--gold); color: var(--gold-ink); border-radius: 999px; padding: 0 10px; font-family: var(--font-mono); font-size: var(--text-sm); white-space: nowrap; }

/* Markieren und Lücken */
.toks { font-family: var(--font-display); font-size: clamp(1.25rem, 3.4vw, 1.5rem); line-height: 2.1; margin: var(--s2) 0 var(--s5); }
.tok { border: 0; background: transparent; padding: 1px 3px; margin: 0 -1px; border-radius: 4px; font: inherit; line-height: 1.4; border-bottom: 2px dotted var(--line-soft); cursor: pointer; color: var(--text); }
.tok:hover:not(:disabled) { background: var(--subtle); }
.tok.sel { background: var(--mark); color: var(--mark-ink); border-bottom-color: transparent; }
.tok.right { background: var(--good-bg); color: var(--good); font-weight: 600; border-bottom: 2px solid var(--good); }
.tok.wrong { background: var(--bad-bg); color: var(--bad); text-decoration: line-through; border-bottom-color: transparent; }
.tok.miss { outline: 2px dashed var(--good); outline-offset: 1px; }
.tok:disabled { cursor: default; }
.gtext { font-family: var(--font-display); font-size: clamp(1.2rem, 3.2vw, 1.45rem); line-height: 2.3; margin: var(--s2) 0 var(--s5); }
.gtext .w { white-space: nowrap; }
.gap { display: inline-block; width: 22px; height: 1.6em; vertical-align: middle; border: 0; padding: 0; margin: 0 1px; background: transparent; border-radius: 4px; position: relative; font: 700 20px/1.6em var(--font-mono); color: var(--primary); cursor: pointer; }
.gap::before { content: ""; position: absolute; left: 50%; top: 18%; bottom: 18%; width: 2px; transform: translateX(-50%); background: var(--line-soft); }
.gap:hover:not(:disabled) { background: var(--subtle); }
.gap.on::before, .gap.miss::before { display: none; }
.gap.right { color: var(--good); background: var(--good-bg); }
.gap.wrong { color: var(--bad); background: var(--bad-bg); text-decoration: line-through; }
.gap.miss { color: var(--good); outline: 2px dashed var(--good); }
.gap:disabled { cursor: default; }

/* Ergebnis */
.bigstars { font-size: var(--text-3xl); letter-spacing: 6px; line-height: 1; margin: var(--s2) 0 var(--s3); }
.bigstars span { display: inline-block; color: var(--line-soft); animation: starin .5s var(--d, 0ms) both; }
.bigstars span.on { color: var(--gold); }
.lead2 { font-size: var(--text-lg); margin-bottom: var(--s3); }
.gain { display: flex; align-items: baseline; gap: var(--s3); margin-bottom: var(--s2); flex-wrap: wrap; }
.gain .b { font-size: var(--text-xl); color: var(--accent-text); }
.miss { margin-top: var(--s4); padding-top: var(--s3); border-top: 2px solid var(--line); }
.recap { display: grid; gap: var(--s2); margin-top: var(--s2); }
.recap .it { border: 2px solid var(--line-soft); border-radius: var(--r); padding: var(--s3); }
.recap .it .qq { font-family: var(--font-display); }
.recap .it .a { color: var(--good); font-weight: 700; }
.summary .card { position: relative; overflow: hidden; }

/* Pokale */
.trophies { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--s2); margin-top: var(--s3); }
.trophy { border: 2px solid var(--line-soft); border-radius: var(--r); padding: var(--s3); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; background: var(--surface); min-width: 0; }
.trophy svg { width: 40px; height: 40px; fill: var(--line-soft); }
.trophy b { font-size: var(--text-sm); line-height: 1.2; }
.trophy span { font-size: var(--text-xs); color: var(--muted); line-height: 1.3; }
.trophy.on { border-color: var(--line); background: var(--accent-bg); }
.trophy.on svg { fill: var(--gold); filter: drop-shadow(0 2px 0 var(--gold-ink)); }
.trophy.new { animation: pop .5s both; }
.trophyrow { display: flex; gap: 6px; flex-wrap: wrap; margin-top: var(--s2); }
.trophyrow svg { width: 26px; height: 26px; fill: var(--line-soft); }
.trophyrow svg.on { fill: var(--gold); }

/* Leseverstehen */
.rlist { display: flex; flex-direction: column; gap: var(--s3); }
.reader { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: var(--s5); align-items: start; margin-top: var(--s3); }
@media (max-width: 900px) { .reader { grid-template-columns: minmax(0, 1fr); } }
.textpane { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: var(--s5) var(--s4) var(--s5) var(--s2); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow: auto; }
@media (max-width: 900px) { .textpane { position: static; max-height: none; } }
.textpane h2 { font-family: var(--font-display); font-weight: 600; font-size: var(--text-xl); padding-left: 44px; margin-bottom: var(--s3); }
.ln { display: grid; grid-template-columns: 36px 1fr; gap: 8px; font-family: var(--font-display); font-size: 1rem; line-height: 1.65; }
.ln span:first-child { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-align: right; padding-top: 5px; }
.ln.hl span:last-child { background: var(--mark); color: var(--mark-ink); }
@media (min-width: 901px) { .ln span:last-child { white-space: nowrap; } }
@media (max-width: 900px) { .ln + .ln { margin-top: 4px; } .ln { line-height: 1.45; } }
.src { padding-left: 44px; margin-top: var(--s3); font-size: var(--text-sm); color: var(--muted); }
.qs { display: grid; gap: var(--s3); }
.qbox .qh { display: flex; gap: var(--s3); align-items: baseline; margin-bottom: var(--s3); }
.qbox .qn { font-family: var(--font-display); font-weight: 600; font-size: var(--text-xl); min-width: 24px; line-height: 1; }
.qbox .qt { font-weight: 700; flex: 1; }
.qbox .pts { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted); white-space: nowrap; }
.stbl { width: 100%; border-collapse: collapse; font-size: var(--text-base); }
.stbl td { border-top: 1px solid var(--line-soft); padding: 8px 4px; vertical-align: top; }
.stbl td.c { width: 1%; white-space: nowrap; }
.segb { display: inline-flex; border: 2px solid var(--line); border-radius: var(--r); overflow: hidden; flex-wrap: wrap; }
.segb button { border: 0; background: var(--surface); padding: 6px 10px; font-size: var(--text-sm); font-weight: 700; border-left: 2px solid var(--line); cursor: pointer; }
.segb button:first-child { border-left: 0; }
.segb button.sel { background: var(--primary); color: var(--on-primary); }
.segb button.right { background: var(--good); color: var(--good-bg); }
.segb button.wrong { background: var(--bad); color: var(--bad-bg); }
.segb button:disabled { cursor: default; }
.xpl { font-size: var(--text-sm); color: var(--muted); margin-top: 4px; }
.xpl.bad { color: var(--bad); }
textarea { width: 100%; min-height: 96px; font: var(--text-base)/1.5 var(--font-body); color: var(--text); background: var(--subtle); border: 2px solid var(--line-soft); border-radius: var(--r); padding: 10px 12px; resize: vertical; }
.model { margin-top: var(--s3); padding: var(--s3); border-radius: var(--r); background: var(--accent-bg); border: 2px solid var(--primary); font-size: var(--text-base); }
.model ul { margin: 6px 0 0; padding-left: 20px; }
.selfscore { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: var(--s3); font-size: var(--text-sm); font-weight: 700; }
.total { position: sticky; bottom: max(12px, env(safe-area-inset-bottom, 0px)); background: var(--header-bg); color: var(--header-text); border-radius: var(--r); padding: var(--s3) var(--s4); display: flex; gap: var(--s3); align-items: center; flex-wrap: wrap; justify-content: space-between; margin-top: var(--s4); }
.total b { font-family: var(--font-mono); font-size: var(--text-lg); }

/* Lernstand */
.statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--s2); }
.statgrid .card b { display: block; font-family: var(--font-mono); font-size: var(--text-xl); }
.typelist { display: grid; gap: 8px; margin-top: var(--s3); }
.typelist .r { display: grid; grid-template-columns: minmax(0, 1fr) 110px 60px; gap: var(--s3); align-items: center; font-size: var(--text-base); }
.typelist .r .stars { font-size: var(--text-base); text-align: right; letter-spacing: 1px; }
.codebox { font-family: var(--font-mono); font-size: var(--text-xs); min-height: 80px; word-break: break-all; }

/* Fuss */
.foot { margin-top: var(--s6); padding-top: var(--s4); border-top: 2px solid var(--line); display: flex; justify-content: space-between; gap: var(--s3); align-items: center; flex-wrap: wrap; }
.foot .author { font-weight: 700; }
.foot .logochip { border: 2px solid var(--line-soft); }

/* Animationen */
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { opacity: 0; transform: scale(.94); } 60% { transform: scale(1.02); } 100% { opacity: 1; transform: none; } }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
@keyframes pulse { 0% { transform: scale(1); } 40% { transform: scale(1.025); } 100% { transform: scale(1); } }
@keyframes starin { 0% { opacity: 0; transform: scale(.2) rotate(-40deg); } 70% { transform: scale(1.25) rotate(8deg); } 100% { opacity: 1; transform: none; } }
@keyframes fly { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--r)); } }
.view { animation: rise .35s both; }
.path > * { animation: rise .45s both; animation-delay: calc(var(--i, 0) * 50ms); }
.fb { animation: pop .3s both; }
.opt.bad, .numin.err { animation: shake .45s; }
.opt.good { animation: pulse .5s; }
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.confetti span { position: absolute; left: 50%; top: 30%; width: 9px; height: 14px; border-radius: 2px; animation: fly 1.3s ease-out both; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

{ id: 'hilf', cat: 'verb', name: 'Hilfsverben finden', exam: 'AP24, AP25', kind: 'mark',

  { t: 'Das Paket [wurde] gestern geliefert.' },

  { t: 'Du musst das nicht tun, wenn du keine Lust hast.', x: 'Kein Hilfsverb: «musst» ist ein Modalverb, «hast» ein Vollverb.' },
  { t: 'Kaum [hatte] sie das Licht gelöscht, wurde es draussen laut.', x: '«wurde laut»: werden ist hier Vollverb (mit Adjektiv), kein Hilfsverb.' }

{ id: 'praep', cat: 'wa', name: 'Präpositionen finden', exam: 'jede Prüfung', kind: 'mark',
  instr: 'Tippe alle Präpositionen an. Falsch markierte Wörter geben Abzug.',
  tip: 'Eine Präposition steht vor einem Nomen oder Pronomen und bestimmt dessen Fall. Fallen: Verbzusätze am Satzende (er rief <i>an</i>), «zu» vor dem Infinitiv, und Konjunktionen wie «während», «bis», «seit», wenn sie einen Nebensatz einleiten. «zum», «beim», «im» sind Präpositionen.',
  items: [
  { t: '[Nach] dem Training gingen wir [in] die Stadt.' },
  { t: 'Sie rief ihre Freundin an und erzählte [von] dem Spiel.', x: '«an» ist Verbzusatz (anrufen).' },
  { t: 'Während er schlief, schlich die Katze [durch] das Zimmer.', x: '«Während» leitet hier einen Nebensatz ein: Konjunktion.' },
  { t: '[Während] des Konzerts war es [im] Saal ganz still.' },
  { t: 'Er hatte keine Lust aufzuräumen und ging lieber [zum] See.' },
  { t: 'Seit sie umgezogen ist, sehen wir uns nur noch [an] den Wochenenden.', x: '«Seit» leitet hier einen Nebensatz ein: Konjunktion.' },
  { t: '[Seit] drei Jahren spielt sie [in] einem Verein.' },
  { t: 'Er stieg [aus] dem Bus aus und lief [über] die Strasse.', x: 'Das zweite «aus» ist Verbzusatz (aussteigen).' },
  { t: '[Trotz] der Kälte trug er nur ein T-Shirt.' },
  { t: 'Die Lehrerin teilte uns mit, dass die Prüfung [wegen] des Feiertags verschoben wird.', x: '«mit» ist Verbzusatz (mitteilen).' },
  { t: 'Wir warteten [bis] Mitternacht, bis endlich das Feuerwerk begann.', x: 'Das erste «bis» steht vor einem Nomen (Präposition), das zweite leitet einen Nebensatz ein (Konjunktion).' },
  { t: 'Er versuchte, [mit] seinem Bruder [über] den Streit zu reden.', x: '«zu» vor dem Infinitiv ist keine Präposition.' },
  { t: '[Ausser] meiner Schwester kamen alle zu spät.', x: '«zu spät»: «zu» ist hier Partikel (Adverb), keine Präposition.' },
  { t: 'Sie legte das Buch [auf] den Tisch und machte das Licht aus.' }
  ]},

{ id: 'konjf', cat: 'wa', name: 'Konjunktionen finden', exam: 'AP26', kind: 'mark',

  { t: 'Sie wusste, [dass] er nicht lügen würde.' },
  { t: 'Willst du Tee [oder] Kaffee?' },
  { t: '[Nachdem] sie gegessen hatten, gingen sie spazieren.' },
  { t: 'Er rannte, [damit] er den Bus nicht verpasste.' },

  { t: '[Als] wir ankamen, war das Konzert schon vorbei.' },
  { t: 'Seit dem Unfall fährt er vorsichtiger, [weil] er Angst hat.', x: '«Seit dem Unfall»: Präposition.' },
  { t: '[Während] die Eltern kochten, deckten die Kinder den Tisch.' }
  ]},

{ id: 'pron', cat: 'wa', name: 'Pronomen finden', exam: 'AP23, AP26', kind: 'mark',

const fresh = () => ({ v: 2, it: {}, st: {}, rd: {}, xp: 0, streak: 0, lastDay: null, stars: {}, tro: {}, rounds: 0, correct: 0, perfect: 0 });
let S = fresh();
try { const raw = localStorage.getItem(SKEY); if (raw) { const p = JSON.parse(raw); if (p && p.it) S = Object.assign(fresh(), p); } } catch (e) {}
function save() { try { localStorage.setItem(SKEY, JSON.stringify(S)); } catch (e) {} }

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const h = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = x => String(Math.round(x * 2) / 2).replace('.', ',');
const TBY = Object.fromEntries(TYPES.map(t => [t.id, t]));
const key = (t, i) => t + ':' + i;
const box = (t, i) => S.it[key(t, i)] ?? -1;
const reduced = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

const LEVELS = [
  { xp: 0, name: 'Notizzettel', d: 'Der Anfang' },

];
const levelOf = x => { let l = 0; LEVELS.forEach((v, i) => { if (x >= v.xp) l = i; }); return l; };
const dayIdx = () => { const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); };
const streakNow = () => S.lastDay === null ? 0 : (dayIdx() - S.lastDay > 2 ? 0 : S.streak);
function touchStreak() {
  const t = dayIdx();
  if (S.lastDay === null) S.streak = 1;
  else { const diff = t - S.lastDay; if (diff === 0) return; S.streak = diff <= 2 ? S.streak + 1 : 1; }
  S.lastDay = t;
}

// ---------- Fortschritt pro Typ ----------
function mastery(t) {
  const n = t.items.length; let sum = 0, sure = 0, seen = 0;
  t.items.forEach((_, i) => { const b = box(t.id, i); if (b >= 0) { seen++; sum += b / 4; if (b >= 3) sure++; } });
  return { p: sum / n, sure, seen, n };
}
const segs = p => { const on = Math.round(p * 10); return '<div class="mast" aria-hidden="true">' + Array.from({ length: 10 }, (_, i) => `<span class="seg${i < on ? ' on' : ''}"></span>`).join('') + '</div>'; };
function weightedPick(cands, n) {
  const out = []; const pool = cands.slice();
  while (out.length < n && pool.length) {
    const tot = pool.reduce((s, c) => s + c.w, 0); let r = Math.random() * tot, k = 0;
    for (; k < pool.length - 1; k++) { r -= pool[k].w; if (r <= 0) break; }
    out.push(pool[k]); pool.splice(k, 1);

}
const itemWeight = (t, i) => { const b = box(t, i); return b < 0 ? 4 : (5 - b) ** 1.5; };

  picks = picks.filter(p => (cnt[p.t] = (cnt[p.t] || 0) + 1) <= 2).slice(0, MIXROUND);

// --- Freitext ---
const QUOTES = /[«»„“”"‹›‚‘]/g;
function norm(s, mode) {
  s = s.normalize('NFC').replace(/ß/g, 'ss').replace(/[’`´]/g, "'").replace(/\s+/g, ' ').trim();
  if (mode === 'strict') return s.replace(QUOTES, '"').replace(/\s*"\s*/g, '"').replace(/\s+([,.!?:;])/g, '$1');
  s = s.replace(/\s+([,.!?:;])/g, '$1').replace(/[.!?]+$/, '').trim();
  if (mode === 'word') s = s.replace(/^(der|die|das|ein|eine)\s+/i, '');
  if (mode === 'verb') s = s.replace(/^(ich|du|er|sie|es|wir|ihr)\s+/i, '');
  return s;
}
function renderInput(t, it, kind, body, acts, fb) {
  const isSent = t.norm === 'sentence' || t.norm === 'strict';
  body.innerHTML = `<div class="q">${esc(it.q).replace(/___/g, '<u>&nbsp;?&nbsp;</u>')}${it.t ? `<span class="target">${esc(it.t)}</span>` : ''}</div>

    const caseOnly = !ok && it.a.some(a => norm(a, mode).toLowerCase() === nv.toLowerCase());
    inp.readOnly = true; inp.classList.add(ok ? 'ok' : 'err');
    record(ok);
    let x = it.x || ''; if (caseOnly) x = 'Achte auf die Gross- und Kleinschreibung. ' + x;
    const sol = esc(it.a[0]) + (it.a.length > 1 ? `<div class="xp">auch richtig: ${it.a.slice(1).map(esc).join(' · ')}</div>` : '');
    let extra = null;

      extra.querySelector('button').onclick = () => {

}

// --- Wörter markieren ---
function tokenize(text) {
  return text.split(' ').map(tok => {
    const m = tok.match(/^([^\p{L}\d\[]*)(\[?)([\p{L}\d\-]+)(\]?)(.*)$/u);
    if (!m) return { pre: tok, w: '', post: '', hit: false };
    return { pre: m[1], w: m[3], post: m[5], hit: m[2] === '[' };
  });
}
function renderMark(t, it, kind, body, acts, fb) {
  const toks = tokenize(it.t);
  body.innerHTML = `<div class="toks">${toks.map((k, j) => `${esc(k.pre)}${k.w ? `<button class="tok" data-j="${j}" aria-pressed="false">${esc(k.w)}</button>` : ''}${esc(k.post)}`).join(' ')}</div>`;
  body.querySelectorAll('.tok').forEach(b => b.onclick = () => { b.classList.toggle('sel'); b.setAttribute('aria-pressed', b.classList.contains('sel')); });
  checkBtn(acts).onclick = () => {
    let ok = true;
    body.querySelectorAll('.tok').forEach(b => {
      const k = toks[+b.dataset.j], sel = b.classList.contains('sel'); b.disabled = true; b.classList.remove('sel');
      if (sel && k.hit) b.classList.add('right'); else if (sel && !k.hit) { b.classList.add('wrong'); ok = false; } else if (!sel && k.hit) { b.classList.add('right', 'miss'); ok = false; }
    });
    const hits = toks.filter(k => k.hit);
    const sol = hits.length ? 'Lösung: ' + hits.map(k => '<b>' + esc(k.w) + '</b>').join(', ') : 'In diesem Satz gibt es keine.';
    record(ok); showFb(fb, ok, sol + '<div class="xp">Gestrichelt = übersehen, durchgestrichen = zu viel markiert.</div>', it.x); nextBtn(acts);
  };
}

// --- Lücken (Satzglieder trennen / Kommas) ---
function renderGaps(t, it, kind, body, acts, fb) {
  const words = [], correct = new Set();
  if (kind === 'split') {
    const parts = it.t.split(' / ');
    parts.forEach((p, pi) => { words.push(...p.split(' ')); if (pi < parts.length - 1) correct.add(words.length - 1); });
  } else {
    it.t.split(' ').forEach((w, j, arr) => { if (/,$/.test(w) && j < arr.length - 1) { correct.add(j); w = w.slice(0, -1); } words.push(w); });
  }
  const sym = kind === 'split' ? '|' : ',';
  body.innerHTML = `<div class="gtext">${words.map((w, j) => `<span class="w">${esc(w)}${j < words.length - 1 ? `<button class="gap" data-j="${j}" aria-label="Lücke nach ${esc(w)}" aria-pressed="false"></button>` : ''}</span>`).join('')}</div>`;
  body.querySelectorAll('.gap').forEach(b => b.onclick = () => { const on = !b.classList.contains('on'); b.classList.toggle('on', on); b.textContent = on ? sym : ''; b.setAttribute('aria-pressed', on); });
  checkBtn(acts).onclick = () => {
    let ok = true;
    body.querySelectorAll('.gap').forEach(b => {
      const j = +b.dataset.j, on = b.classList.contains('on'), c = correct.has(j); b.disabled = true;
      if (on && c) b.classList.add('right'); else if (on && !c) { b.classList.add('wrong'); ok = false; } else if (!on && c) { b.classList.add('miss'); b.textContent = sym; ok = false; }
    });
    const sol = kind === 'split' ? esc(it.t).replace(/ \/ /g, ' <b>/</b> ') : esc(it.t).replace(/,/g, '<b>,</b>');
    record(ok); showFb(fb, ok, sol, it.x); nextBtn(acts);
  };
}

  else bonus = c === n ? 20 : c >= n * .75 ? 10 : 0;
  S.xp += bonus; S.rounds++; if (c === n) S.perfect++;
  touchStreak();
  const neu = checkTrophies(); save();
  const lvA = levelOf(S.xp); const lv = LEVELS[lvA];
  const wrong = SES.list.map((p, k) => ({ ...p, k })).filter(p => !SES.res[p.k]);
  const solText = (t, it) => { const kind = it.k || t.kind;
    if (kind === 'mc') return esc((it.o || t.opts)[it.a]);
    if (kind === 'input') return esc(it.a[0]);

    return (it.q || '') + (it.t && kind === 'input' ? ` <span class="tag">→ ${esc(it.t)}</span>` : ''); };
  const headline = c === n ? 'Fehlerfrei. Stark.' : c >= n * .75 ? 'Gut gemacht.' : 'Weiter üben lohnt sich.';
  mount(`<div class="summary">
    <section class="card" id="sumcard">
      <div class="tag">${esc(SES.title)}</div>
      <h2 class="sumh" style="margin:8px 0">${headline}</h2>
      ${SES.mode === 'type' ? `<div class="bigstars" aria-label="${stars} von 3 Sternen">${[0, 1, 2].map(i => `<span class="${i < stars ? 'on' : ''}" style="--d:${i * 220}ms">${i < stars ? '★' : '☆'}</span>`).join('')}</div>` : ''}
      <p class="lead2"><span class="mono b">${c} von ${n}</span> richtig.</p>
      ${SES.mode === 'type' && stars < 3 ? `<p class="small">${stars === 0 ? 'Für den ersten Stern brauchst du 6 von 8.' : 'Für 3 Sterne brauchst du alle richtig.'}${prevStars > stars ? ` Dein Bestwert bleibt bei ${prevStars} ${prevStars === 1 ? 'Stern' : 'Sternen'}.` : ''}</p>` : ''}
      <div class="gain"><span class="mono b" data-count="${SES.xp + bonus}" data-prefix="+" data-suffix=" XP">+${SES.xp + bonus} XP</span><span class="small">${bonus ? `davon ${bonus} Bonus` : 'kein Bonus in dieser Runde'}</span></div>
      <p class="small">Serie: <span class="mono b">${streakNow()} ${streakNow() === 1 ? 'Tag' : 'Tage'}</span></p>
      ${lvA > lvB ? `<div class="fb good"><div class="fbt">Neue Stufe: ${lv.name}</div><div class="fbb">${lv.d}</div></div>` : ''}
      ${neu.length ? `<div class="fb good"><div class="fbt">${neu.length === 1 ? 'Neuer Pokal!' : neu.length + ' neue Pokale!'}</div><div class="trophies">${neu.map(t => trophyCard(t, true)).join('')}</div></div>` : ''}
      ${wrong.length ? `<div class="miss"><div class="tag">Das kommt wieder</div><div class="recap">${wrong.map(p => { const t = TBY[p.t], it = t.items[p.i]; return `<div class="it"><div class="small">${t.name}</div><div class="qq">${qText(t, it)}</div><div class="a">${solText(t, it)}</div></div>`; }).join('')}</div></div>` : ''}
    </section>
    <button class="btn btn-primary block" id="again">Noch eine Runde</button>
    <button class="btn block" id="home">Zum Lernpfad</button></div>`);
  $app.querySelector('#again').onclick = SES.again;
  $app.querySelector('#home').onclick = () => go('grammar');
  if (stars === 3 || c === n || neu.length || lvA > lvB) setTimeout(() => confetti($app.querySelector('#sumcard')), 250);
}

// ---------- Leseverstehen ----------
function qMax(q) { return q.k === 'rfk' || q.k === 'odd' ? q.st.length : q.k === 'rf' ? q.st.length / 2 : q.p; }
function maxPts(r) { return r.qs.reduce((s, q) => s + qMax(q), 0); }
function viewReadList() {
  mount(`
    <div class="row"><h2>Leseverstehen</h2><span class="small">ca. 15 Minuten pro Text</span></div>
    <p class="small" style="margin-bottom:12px">Literarische Texte mit Zeilennummern und Fragen wie in der Prüfung: richtig / falsch / kein Hinweis, Pronomen-Bezüge, Wortbedeutung und offene Fragen. Pro erreichtem Punkt gibt es 4 XP.</p>
    <div class="path">${READ.map((r, k) => { const b = S.rd[r.id], mx = maxPts(r); const st = b ? (b.best >= .9 * mx ? 3 : b.best >= .75 * mx ? 2 : b.best >= .5 * mx ? 1 : 0) : 0; return `
      <article class="card st" style="--i:${k}">
        <div class="num mono" aria-hidden="true">${k + 1}</div>
        <div class="stbody">
          <h3>${esc(r.title)}</h3>
          <div class="sub">${r.genre} · ${r.lines.length} Zeilen · ${r.qs.length} Aufgaben · ${fmt(mx)} Punkte</div>
          <p class="small" style="margin-top:6px;font-family:var(--font-display)">${esc(r.lines[0])} …</p>
          <div class="starsrow"><span class="stars">${starTxt(st)}</span><span class="small">${b ? 'Bestwert ' + fmt(b.best) + ' / ' + fmt(mx) : 'noch nicht gelöst'}</span></div>
        </div>
        <button class="btn" data-r="${r.id}">${b ? 'Nochmals' : 'Lesen'}</button>
      </article>`; }).join('')}</div>
    <p class="small" style="margin-top:20px">Alle Texte sind eigene Übungstexte im Stil der Prüfung. Die Originalprüfungen findest du auf der Website der Thurgauer Kantonsschulen.</p>`, { head: true });
  $app.querySelectorAll('[data-r]').forEach(b => b.onclick = () => viewReader(b.dataset.r));
}

function viewReader(rid) {
  const r = READ.find(x => x.id === rid); const A = {}; let done = false, finished = false; const self = {};
  const seg = (name, labels, vals) => `<div class="segb" role="group">${labels.map((l, k) => `<button data-n="${name}" data-v="${vals[k]}">${l}</button>`).join('')}</div>`;
  const qHtml = (q, qi) => {
    let inner = '';
    if (q.k === 'rfk' || q.k === 'rf') {
      const L = q.k === 'rfk' ? ['richtig', 'falsch', 'kein Hinweis'] : ['richtig', 'falsch'], V = q.k === 'rfk' ? ['r', 'f', 'k'] : ['r', 'f'];
      inner = `<table class="stbl">${q.st.map((s, si) => `<tr><td>${esc(s.s)}<div class="xpl" id="x-${qi}-${si}"></div></td><td class="c">${seg(qi + '-' + si, L, V)}</td></tr>`).join('')}</table>`;
    } else if (q.k === 'odd') {
      inner = q.st.map((s, si) => `<div style="margin-top:${si ? 14 : 0}px"><div class="ow" style="font-family:var(--font-display);font-weight:600;margin-bottom:6px">${esc(s.w)}</div>${seg(qi + '-' + si, s.o.map(esc), s.o.map((_, k) => k))}<div class="xpl" id="x-${qi}-${si}"></div></div>`).join('');
    } else if (q.k === 'mc') {
      inner = `<div class="opts">${q.o.map((o, k) => `<button class="opt" data-n="${qi}-0" data-v="${k}"><span class="ltr mono" aria-hidden="true">${'ABCD'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div><div class="xpl" id="x-${qi}-0"></div>`;
    } else {
      inner = `<textarea id="ta-${qi}" placeholder="Antworte in ganzen Sätzen …" aria-label="Antwort zu Aufgabe ${qi + 1}"></textarea><div id="m-${qi}"></div>`;
    }
    return `<section class="card qbox" id="q-${qi}"><div class="qh"><span class="qn">${qi + 1}</span><span class="qt">${q.q}</span><span class="pts">${fmt(qMax(q))} P.</span></div>${inner}</section>`;
  };
  mount(`
    <div class="rtop"><button class="btn sm" id="back">Alle Texte</button><span class="mono small">Leseverstehen · ${fmt(maxPts(r))} Punkte</span></div>
    <p class="small" style="margin-top:12px">Zeilenangaben in den Fragen kannst du antippen: Die Stelle wird im Text markiert.</p>
    <div class="reader">
      <article class="textpane" aria-label="Text">
        <h2>${esc(r.title)}</h2>
        ${r.lines.map((l, k) => `<div class="ln" id="ln-${k + 1}"><span>${(k + 1) % 5 === 0 || k === 0 ? k + 1 : ''}</span><span>${esc(l)}</span></div>`).join('')}
        <div class="src">Eigener Übungstext im Stil der Aufnahmeprüfung</div>
      </article>
      <div>
        <div class="qs">${r.qs.map(qHtml).join('')}</div>
        <div class="total" id="totbar"><span id="tot">Beantworte alle Aufgaben, dann werte aus.</span><button class="btn btn-primary" id="eval">Auswerten</button></div>
        <div id="rres"></div>
      </div>
    </div>`, { wide: true });
  $app.querySelector('#back').onclick = () => go('read');
  $app.querySelectorAll('.qt, .stbl td:first-child, .ow').forEach(el => {
    el.innerHTML = el.innerHTML.replace(/Z\. (\d+)(?:[\/–-](\d+))?/g, (m, a, b) => `<button class="linkbtn" data-l="${a}-${b || a}">${m}</button>`);
  });
  $app.querySelectorAll('[data-l]').forEach(b => b.onclick = () => {
    const [a, z] = b.dataset.l.split('-').map(Number);
    $app.querySelectorAll('.ln.hl').forEach(x => x.classList.remove('hl'));
    for (let k = a; k <= z; k++) $app.querySelector('#ln-' + k)?.classList.add('hl');
    $app.querySelector('#ln-' + a)?.scrollIntoView({ block: 'center', behavior: reduced() ? 'auto' : 'smooth' });
  });
  $app.querySelectorAll('[data-n]').forEach(b => b.onclick = () => {
    if (done) return; A[b.dataset.n] = b.dataset.v;
    $app.querySelectorAll(`[data-n="${b.dataset.n}"]`).forEach(o => o.classList.toggle('sel', o === b));
  });
  const total = () => {
    let auto = 0, slf = 0, open = 0;
    r.qs.forEach((q, qi) => {
      if (q.k === 'open') { open++; if (self[qi] != null) slf += self[qi]; return; }
      const val = q.k === 'rf' ? .5 : q.k === 'mc' ? q.p : 1;
      (q.k === 'mc' ? [{ a: q.a }] : q.st).forEach((s, si) => { if (String(A[qi + '-' + si]) === String(s.a)) auto += val; });
    });
    const rated = Object.keys(self).length, sum = auto + slf, mx = maxPts(r);
    $app.querySelector('#tot').innerHTML = `<b>${fmt(sum)} / ${fmt(mx)}</b> &nbsp;${rated < open ? `Bewerte noch ${open - rated} offene Antwort${open - rated > 1 ? 'en' : ''} selbst.` : 'Fertig bewertet.'}`;
    if (rated === open && !finished) {
      finished = true;
      const prev = S.rd[r.id] ? S.rd[r.id].best : 0, gain = Math.max(0, Math.round((sum - prev) * 4)), lvB = levelOf(S.xp);
      if (sum > prev || !S.rd[r.id]) S.rd[r.id] = { best: Math.max(sum, prev), d: Date.now() };
      S.xp += gain; touchStreak(); const neu = checkTrophies(); save();
      const lvA = levelOf(S.xp);
      const res = $app.querySelector('#rres');
      res.innerHTML = `<section class="card summary" style="margin-top:16px;position:relative;overflow:hidden" id="rcard">
        <div class="tag">${esc(r.title)}</div><h2 class="sumh" style="margin:8px 0">${sum >= .9 * mx ? 'Genau gelesen.' : sum >= .7 * mx ? 'Gut gemacht.' : 'Lies die Musterlösungen genau durch.'}</h2>
        <p class="lead2"><span class="mono b">${fmt(sum)} von ${fmt(mx)}</span> Punkten.</p>
        <div class="gain"><span class="mono b">+${gain} XP</span><span class="small">${prev && gain === 0 ? 'XP gibt es nur, wenn du deinen Bestwert verbesserst.' : '4 XP pro neuem Punkt'}</span></div>
        ${lvA > lvB ? `<div class="fb good"><div class="fbt">Neue Stufe: ${LEVELS[lvA].name}</div></div>` : ''}
        ${neu.length ? `<div class="fb good"><div class="fbt">${neu.length === 1 ? 'Neuer Pokal!' : neu.length + ' neue Pokale!'}</div><div class="trophies">${neu.map(t => trophyCard(t, true)).join('')}</div></div>` : ''}
        <button class="btn block" id="rback">Zu den Texten</button></section>`;
      res.querySelector('#rback').onclick = () => go('read');
      if (gain || neu.length) setTimeout(() => confetti(res.querySelector('#rcard')), 200);
    }
  };
  $app.querySelector('#eval').onclick = ev => {
    if (done) return;
    const missing = r.qs.some((q, qi) => q.k === 'open' ? !$app.querySelector('#ta-' + qi).value.trim() : (q.k === 'mc' ? [0] : q.st).some((_, si) => A[qi + '-' + si] == null));
    if (missing && !ev.target.dataset.sure) { ev.target.dataset.sure = 1; $app.querySelector('#tot').textContent = 'Es fehlen noch Antworten. Nochmals tippen, um trotzdem auszuwerten.'; return; }
    done = true; ev.target.remove();
    r.qs.forEach((q, qi) => {
      if (q.k === 'open') {
        $app.querySelector('#ta-' + qi).readOnly = true;
        const m = $app.querySelector('#m-' + qi);
        m.innerHTML = `<div class="model"><b>Musterlösung</b><div>${esc(q.model)}</div><ul>${q.crit.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div>
          <div class="selfscore">Deine Punkte: <div class="segb">${Array.from({ length: q.p + 1 }, (_, k) => `<button data-s="${k}">${k}</button>`).join('')}</div></div>`;
        m.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { if (finished) return; self[qi] = +b.dataset.s; m.querySelectorAll('[data-s]').forEach(o => o.classList.toggle('sel', o === b)); total(); });
        return;
      }
      (q.k === 'mc' ? [{ a: q.a, x: q.x }] : q.st).forEach((s, si) => {
        const n = qi + '-' + si, given = A[n];
        $app.querySelectorAll(`[data-n="${n}"]`).forEach(o => { o.disabled = true; o.classList.remove('sel');
          if (String(o.dataset.v) === String(s.a)) o.classList.add(o.classList.contains('opt') ? 'good' : 'right');
          else if (o.dataset.v === given) o.classList.add(o.classList.contains('opt') ? 'bad' : 'wrong'); });
        const xe = $app.querySelector(`#x-${n}`), ok = String(given) === String(s.a);
        if (xe && (!ok || s.x)) { xe.textContent = (ok ? '' : given == null ? 'Nicht beantwortet. ' : 'Falsch. ') + (s.x || ''); if (!ok) xe.classList.add('bad'); }
      });
    });
    total();
  };
}

// ---------- Pokale & Lernstand ----------
function viewStats() {
  const all = TYPES.map(t => ({ t, m: mastery(t) }));
  const n = all.reduce((s, a) => s + a.m.n, 0), seen = all.reduce((s, a) => s + a.m.seen, 0), sure = all.reduce((s, a) => s + a.m.sure, 0);
  const tries = Object.values(S.st).reduce((s, x) => s + x.n, 0), oks = Object.values(S.st).reduce((s, x) => s + x.ok, 0);
  const starSum = TYPES.reduce((s, t) => s + (S.stars[t.id] || 0), 0);
  mount(`
    <div class="row"><h2>Pokalschrank</h2><span class="small">${Object.keys(S.tro).length} von ${TROPHIES.length}</span></div>
    <div class="trophies">${TROPHIES.map(t => trophyCard(t)).join('')}</div>
    <div class="row"><h2>Lernstand</h2></div>
    <div class="statgrid">
      <div class="card"><b>${sure}</b><span class="small">von ${n} Aufgaben sicher</span></div>
      <div class="card"><b>${seen}</b><span class="small">Aufgaben gesehen</span></div>
      <div class="card"><b>${tries ? Math.round(oks / tries * 100) : 0}%</b><span class="small">Trefferquote (${tries})</span></div>
      <div class="card"><b>${starSum}/${TYPES.length * 3}</b><span class="small">Sterne gesammelt</span></div>
    </div>
    <section class="card" style="margin-top:12px"><div class="tag">Alle Aufgabentypen</div>
      <div class="typelist">${all.map(a => `<div class="r"><span>${a.t.name}</span>${segs(a.m.p)}<span class="stars">${starTxt(S.stars[a.t.id] || 0)}</span></div>`).join('')}</div>
    </section>
    <section class="card review" style="margin-top:12px;grid-template-columns:1fr">
      <div><h3>Lernstand sichern</h3><p class="small">Dein Fortschritt liegt nur in diesem Browser. Kopiere den Code und bewahre ihn auf, zum Beispiel in deinen Notizen. Auf einem anderen Gerät fügst du ihn unten ein.</p></div>
      <textarea id="code" class="codebox" readonly aria-label="Lernstand-Code"></textarea>
      <div class="ansrow"><button class="btn btn-primary" id="copy">Code kopieren</button><span class="small" id="copymsg" style="align-self:center"></span></div>
      <textarea id="imp" class="codebox" placeholder="Code hier einfügen …" aria-label="Code einfügen"></textarea>
      <div class="ansrow"><button class="btn" id="load">Lernstand laden</button><span class="small" id="loadmsg" style="align-self:center"></span></div>
    </section>
    <div style="margin-top:16px"><button class="btn sm" id="reset">Fortschritt zurücksetzen</button></div>`, { head: true });
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  $app.querySelector('#code').value = code;
  $app.querySelector('#copy').onclick = () => {
    const ta = $app.querySelector('#code'), msg = $app.querySelector('#copymsg');
    const fallback = () => { ta.focus(); ta.select(); msg.textContent = 'Code markiert. Jetzt mit Cmd/Ctrl+C kopieren.'; };
    try { navigator.clipboard.writeText(code).then(() => msg.textContent = 'Kopiert.', fallback); } catch (e) { fallback(); }
  };
  $app.querySelector('#load').onclick = () => {
    try {
      const p = JSON.parse(decodeURIComponent(escape(atob($app.querySelector('#imp').value.trim()))));
      if (!p || typeof p.it !== 'object') throw 0;
      S = Object.assign(fresh(), p); save(); lastXpShown = null; viewStats();
    } catch (e) { $app.querySelector('#loadmsg').textContent = 'Dieser Code ist ungültig. Prüfe, ob er vollständig kopiert wurde.'; }
  };
  const rb = $app.querySelector('#reset');
  rb.onclick = () => {
    if (!rb.dataset.sure) { rb.dataset.sure = 1; rb.textContent = 'Sicher? Nochmals tippen zum Löschen'; return; }
    S = fresh(); save(); lastXpShown = null; viewStats();
  };
}

go(tab);

</script>
</body></html>
